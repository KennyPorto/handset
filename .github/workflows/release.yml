name: Release

# On a version tag: build the Flatpak, pack the FlatPark archive from that build,
# attest where it came from, and attach it to the tag's GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # test run: builds and attests, attaches nothing

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  flatpark-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: >
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse
          --force-clean build io.github.kennyporto.Handset.yml
      - run: sh scripts/flatpark-tarball.sh build/files
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: handset-linux-x86_64-flatpark.tar.gz
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Handset ${TAG#v}" --generate-notes
          gh release upload "$TAG" handset-linux-x86_64-flatpark.tar.gz --clobber
